---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo-lite
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
data:
  MONGODB_INITDB_ROOT_USERNAME: "user"

---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secrets
type: Opaque
data:
  MONGODB_INITDB_ROOT_PASSWORD: cGFzc3dvcmQ=   # base64 for "password"

---
apiVersion: v1
kind: Pod
metadata:
  name: mongo-lite
  labels:
    app: mongo-lite
spec:
  terminationGracePeriodSeconds: 10
  containers:
  - name: mongo
    image: mongo:6.0
    ports:
      - containerPort: 27017
    envFrom:
      - configMapRef:
          name: mongo-config
      - secretRef:
          name: mongo-secrets
    volumeMounts:
      - name: mongo-data
        mountPath: /data/db
  volumes:
    - name: mongo-data
      emptyDir: {}
