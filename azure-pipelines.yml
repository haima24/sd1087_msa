trigger:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  containerRegistry: 'sd1087tuhuynhacr.azurecr.io'
  acrUsername: 'sd1087tuhuynhACR'   # ACR Admin username
  acrPassword: ''  # ACR Admin password
  frontendImageName: 'frontend'
  backendImageName: 'backend'
  imageTag: '$(Build.BuildId)'
  kubernetesServiceConnection: 'AzureKubernetesServiceSC'
  namespace: 'default'

stages:
- stage: BuildAndPush
  displayName: Build and Push Docker Images
  jobs:
  - job: BuildPushJob
    displayName: Build and Push Frontend and Backend
    steps:

    # Login to ACR
    - task: Bash@3
      displayName: Login to ACR
      inputs:
        targetType: 'inline'
        script: |
          echo "$(acrPassword)" | docker login $(containerRegistry) -u $(acrUsername) --password-stdin

    # Build Frontend Docker Image
    - task: Docker@2
      displayName: Build frontend Docker image
      inputs:
        repository: $(containerRegistry)/$(frontendImageName)
        command: build
        Dockerfile: src/frontend/Dockerfile
        tags: |
            $(imageTag)
            latest
        buildContext: src/frontend

    # Push Frontend Docker Image
    - task: Docker@2
      displayName: Push frontend Docker image
      inputs:
        repository: $(containerRegistry)/$(frontendImageName)
        command: push
        tags: |
            $(imageTag)
            latest

    # Build Backend Docker Image
    - task: Docker@2
      displayName: Build backend Docker image
      inputs:
        repository: $(containerRegistry)/$(backendImageName)
        command: build
        Dockerfile: src/backend/Dockerfile
        tags: |
            $(imageTag)
            latest

        buildContext: src/backend

    # Push Backend Docker Image
    - task: Docker@2
      displayName: Push backend Docker image
      inputs:
        repository: $(containerRegistry)/$(backendImageName)
        command: push
        tags: |
            $(imageTag)
            latest

    # Update backend.yaml image tag
    - task: Bash@3
      displayName: Update backend.yaml image tag
      inputs:
        targetType: 'inline'
        script: |
          sed -i "s|image:.*|image: $(containerRegistry)/$(backendImageName):$(imageTag)|g" Manifest-Azure/backend.yaml

    # Publish backend manifest
    - publish: Manifest-Azure/backend.yaml
      artifact: manifest

# ----------------------------
# Stage 2: Deploy to AKS
# ----------------------------
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: BuildAndPush
  jobs:
  - job: DeployJob
    displayName: Deploy Kubernetes Resources
    steps:

    - checkout: self

# Set Kubernetes context (login)
    - task: Kubernetes@1
      displayName: Set AKS context
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: $(kubernetesServiceConnection)
        namespace: $(namespace)
        command: 'login'

    # Deploy or Update MongoDB
    - task: Bash@3
      displayName: Deploy or Update MongoDB
      inputs:
        targetType: 'inline'
        script: |
          if kubectl get statefulset mongo -n $(namespace) >/dev/null 2>&1; then
            echo "Updating existing MongoDB StatefulSet image..."
            kubectl set image statefulset/mongo mongo=mongo:6.0 -n $(namespace)
          else
            echo "MongoDB StatefulSet not found — creating new one..."
            kubectl apply -f Manifest-Azure/mongodb.yaml -n $(namespace)
          fi

    # Deploy Backend
    - task: Kubernetes@1
      displayName: Deploy Backend
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: $(kubernetesServiceConnection)
        namespace: $(namespace)
        command: 'apply'
        useConfigurationFile: true
        configuration: 'Manifest-Azure/backend.yaml'

    # Deploy Frontend
    - task: Kubernetes@1
      displayName: Deploy Frontend
      inputs:
        connectionType: 'Kubernetes Service Connection'
        kubernetesServiceEndpoint: $(kubernetesServiceConnection)
        namespace: $(namespace)
        command: 'apply'
        useConfigurationFile: true
        configuration: 'Manifest-Azure/frontend.yaml'
